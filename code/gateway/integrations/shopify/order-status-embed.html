<!--
  ScanPay UPI — Shopify order-status embed.
  Paste this into: Shopify admin → Settings → Checkout → "Order status page"
  additional scripts (or add as a theme app-embed on the Thank-you / Order-status page).

  It runs only for orders whose payment method is your manual "UPI (ScanPay)"
  method, creates a ScanPay order linked to this Shopify order, and shows the
  QR + "enter UTR" flow inline. When you approve in the ScanPay CRM, ScanPay
  marks THIS Shopify order as paid automatically.

  >>> Set SCANTOPAY_URL to your ScanPay public URL (tunnel or deployed host). <<<
-->
<div id="scantopay-upi"></div>
<script>
(function () {
  var SCANTOPAY_URL = "https://YOUR-SCANTOPAY-URL";   // <-- set me
  var MANUAL_METHOD = "UPI (ScanPay)";              // must match your manual payment method name

  // Shopify exposes order context on the order-status page.
  var co = window.Shopify && window.Shopify.checkout;
  if (!co) return;

  // Only show for the manual UPI method, and only while still unpaid.
  var gateways = (co.payment_gateway_names || []).join(" ").toLowerCase();
  var isUpi = gateways.indexOf("upi") !== -1 || gateways.indexOf("scantopay") !== -1;
  if (!isUpi) return;
  if (co.financial_status && co.financial_status !== "pending") return;

  var amount = Number(co.total_price || (co.payment_due) || 0);
  var ref = "gid://shopify/Order/" + co.order_id;
  var payload = {
    amount: amount,
    ref: ref,
    ref_name: co.order_id ? ("#" + (co.order_number || co.order_id)) : null,
    items: [{ name: "Order " + (co.order_number || co.order_id), qty: 1, price: amount }],
    customer: {
      name: (co.billing_address && co.billing_address.name) || "",
      email: co.email || "",
      phone: (co.billing_address && co.billing_address.phone) || "",
      verified: true
    }
  };

  fetch(SCANTOPAY_URL + "/api/orders", {
    method: "POST",
    headers: { "content-type": "application/json" },
    body: JSON.stringify(payload)
  })
  .then(function (r) { return r.json(); })
  .then(function (order) {
    var el = document.getElementById("scantopay-upi");
    el.innerHTML =
      '<div style="margin:16px 0;border:1px solid #e4dcdc;border-radius:14px;overflow:hidden">' +
      '<div style="padding:10px 14px;font:600 13px system-ui;background:#2A0708;color:#fff">Pay with UPI</div>' +
      '<iframe src="' + SCANTOPAY_URL + '/checkout?id=' + order.id +
      '" style="width:100%;height:760px;border:0;display:block"></iframe></div>';
  })
  .catch(function (e) { console.log("ScanPay embed error", e); });
})();
</script>
